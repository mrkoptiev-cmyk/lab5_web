name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask gunicorn flask-wtf flask-bootstrap pillow keras tensorflow==2.0.0-alpha0 

    - name: Run app check
      run: |
        python -c "import flaskapp.some_app"
        chmod +x st.sh
        ./st.sh
